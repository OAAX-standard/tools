name: Run tests

on:
  push:

jobs:
  run-tests-on-ubuntu-22-04:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Compile unit tests
        run: bash tests/build-and-run.sh

  run-tests-on-ubuntu-22-04-arm:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Compile unit tests
        run: bash tests/build-and-run.sh

  run-tests-on-windows-latest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Compile unit tests
        run: |
          cd tests
          .\build-and-run.bat

  run-tests-on-windows-11-arm:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Compile unit tests
        run: |
          cd tests
          .\build-and-run.bat